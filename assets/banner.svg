<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="25%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#21211F" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242422" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#191918" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="aksaPrimaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9676"/>
      <stop offset="60%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#B85536"/>
    </linearGradient>
    <linearGradient id="aksaSecondaryGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F28E6E"/>
      <stop offset="100%" stop-color="#9C3E20"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E2DF"/>
    </linearGradient>

    <!-- Core Nexus / Eye Gradient -->
    <radialGradient id="nexusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Deep Slate Canvas -->
  <rect width="1200" height="480" fill="#141413"/>
  <rect width="1200" height="480" fill="url(#bgGlow)"/>
  <rect width="1200" height="480" fill="url(#nodeGlow)"/>
  <rect width="1200" height="480" fill="url(#dotGrid)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="478" rx="0" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- ================= LEFT: HERO BRANDING ================= -->
  <g transform="translate(75, 68)">
    <!-- Pill Badge -->
    <g filter="url(#dropShadow)">
      <rect x="0" y="0" width="375" height="32" rx="16" fill="#21211F" stroke="#D97757" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="16" cy="16" r="4.5" fill="#10B981"/>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" fill="#ECECEB" letter-spacing="0.8">
        AI DESKTOP OPERATING ASSISTANT
      </text>
    </g>

    <!-- Logo & Giant Typography -->
    <g transform="translate(0, 50)">
      <!-- Logo Emblem Box -->
      <g filter="url(#dropShadow)">
        <rect x="0" y="0" width="68" height="68" rx="18" fill="#1E1E1C" stroke="#D97757" stroke-opacity="0.35" stroke-width="1.5"/>
        
        <!-- Embedded AKSA Geometric Monogram -->
        <g transform="translate(4.5, 4.5) scale(0.23)" filter="url(#logoShadow)">
          <!-- Left Wing of 'A' -->
          <path d="M 128 44 L 128 82 L 78 184 L 46 184 Z" fill="url(#aksaPrimaryGrad)"/>
          <!-- Right Wing of 'A' -->
          <path d="M 128 44 L 210 184 L 178 184 L 128 82 Z" fill="url(#aksaSecondaryGrad)"/>
          <!-- Central Crossbar -->
          <path d="M 82 144 L 174 144 L 160 166 L 96 166 Z" fill="#D97757" fill-opacity="0.95"/>
          <!-- Radiant Nexus / Eye -->
          <g transform="translate(128, 126)" filter="url(#softGlow)">
            <circle cx="0" cy="0" r="18" fill="#10B981" fill-opacity="0.25"/>
            <polygon points="0,-12 12,0 0,12 -12,0" fill="url(#nexusGlow)"/>
            <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
          </g>
        </g>
      </g>

      <!-- Typography -->
      <text x="86" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="68" font-weight="900" fill="url(#textGrad)" letter-spacing="5">
        AKSA
      </text>
    </g>

    <!-- Acronym & Full Meaning -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="700" fill="#ECECEB" letter-spacing="0.3">
        <tspan fill="#D97757">A</tspan>sisten <tspan fill="#D97757">K</tspan>erja &amp; <tspan fill="#D97757">S</tspan>istem <tspan fill="#D97757">A</tspan>utomasi
      </text>
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13.5" font-weight="400" fill="#9C9A92">
        AI Desktop Operating Assistant: Kontrol Aplikasi, Izin OS &amp; Keahlian Eksternal
      </text>
    </g>

    <!-- Feature Tag Pills -->
    <g transform="translate(0, 230)">
      <!-- Row 1: App Intelligence, OS Permission Broker, External Skills -->
      <rect x="0" y="0" width="144" height="28" rx="8" fill="#1F1F1D" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="14" cy="14" r="3.5" fill="#10B981"/>
      <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#DCDCDA">
        App Intelligence
      </text>

      <rect x="154" y="0" width="168" height="28" rx="8" fill="#1F1F1D" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="168" cy="14" r="3.5" fill="#F59E0B"/>
      <text x="180" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#DCDCDA">
        OS Permission Broker
      </text>

      <rect x="332" y="0" width="160" height="28" rx="8" fill="#1F1F1D" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="346" cy="14" r="3.5" fill="#8B5CF6"/>
      <text x="358" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#DCDCDA">
        Agent Skills (SKILL.md)
      </text>

      <!-- Row 2: MCP Runtime, Native OS Execution, Local Sovereignty -->
      <rect x="0" y="38" width="166" height="28" rx="8" fill="#1F1F1D" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="14" cy="52" r="3.5" fill="#38BDF8"/>
      <text x="26" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#DCDCDA">
        Integration Manager (MCP)
      </text>

      <rect x="176" y="38" width="158" height="28" rx="8" fill="#1F1F1D" stroke="#D97757" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="190" cy="52" r="3.5" fill="#D97757"/>
      <text x="202" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#DCDCDA">
        Native OS Execution
      </text>

      <rect x="344" y="38" width="148" height="28" rx="8" fill="#1F1F1D" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
      <circle cx="358" cy="52" r="3.5" fill="#10B981"/>
      <text x="370" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#DCDCDA">
        Kedaulatan Lokal
      </text>
    </g>
  </g>

  <!-- ================= RIGHT: ARCHITECTURE FLOW MOCKUP ================= -->
  <g transform="translate(650, 42)" filter="url(#dropShadow)">
    <!-- Mockup Container Box -->
    <rect x="0" y="0" width="480" height="396" rx="14" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect x="0" y="0" width="480" height="38" rx="14" fill="#1C1C1A" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    <!-- Mac Window Control Dots -->
    <circle cx="20" cy="19" r="4.5" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="35" cy="19" r="4.5" fill="#F59E0B" fill-opacity="0.8"/>
    <circle cx="50" cy="19" r="4.5" fill="#10B981" fill-opacity="0.8"/>
    <text x="240" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#9C9A92" letter-spacing="0.3">
      AKSA — Desktop Intelligence Architecture
    </text>

    <!-- Top Card: AKSA AI Orchestrator -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="440" height="66" rx="12" fill="#21211F" stroke="#D97757" stroke-width="1.5"/>
      <!-- Brain Icon Box -->
      <rect x="14" y="14" width="38" height="38" rx="9" fill="#D97757" fill-opacity="0.15" stroke="#D97757" stroke-opacity="0.3"/>
      <circle cx="33" cy="33" r="8" fill="#D97757"/>
      <circle cx="33" cy="33" r="3" fill="#FFFFFF"/>
      <text x="64" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
        AKSA AI Orchestrator
      </text>
      <text x="64" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="400" fill="#9C9A92">
        Memahami perintah, memilih aplikasi, skill, dan tools kerja
      </text>
    </g>

    <!-- Down Connector 1 (Arrow) -->
    <g transform="translate(240, 116)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#D97757" stroke-width="1.5" stroke-opacity="0.6"/>
      <polygon points="0,22 -4,15 4,15" fill="#D97757"/>
    </g>

    <!-- Middle 2x2 Grid: 4 Core Desktop Intelligence Engines -->
    
    <!-- 1. App Intelligence (Top-Left) -->
    <g transform="translate(20, 142)">
      <rect x="0" y="0" width="214" height="68" rx="10" fill="#21211F" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="12" y="12" width="24" height="24" rx="6" fill="#10B981" fill-opacity="0.15"/>
      <circle cx="24" cy="24" r="5" fill="#10B981"/>
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#ECECEB">
        App Intelligence
      </text>
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" fill="#9C9A92">
        Deteksi aplikasi terpasang &amp; aktif
      </text>
    </g>

    <!-- 2. OS Permission Broker (Top-Right) -->
    <g transform="translate(246, 142)">
      <rect x="0" y="0" width="214" height="68" rx="10" fill="#21211F" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="12" y="12" width="24" height="24" rx="6" fill="#F59E0B" fill-opacity="0.15"/>
      <circle cx="24" cy="24" r="5" fill="#F59E0B"/>
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#ECECEB">
        OS Permission Broker
      </text>
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" fill="#9C9A92">
        Izin native Windows &amp; macOS
      </text>
    </g>

    <!-- 3. External Skill Manager (Bottom-Left) -->
    <g transform="translate(20, 218)">
      <rect x="0" y="0" width="214" height="68" rx="10" fill="#21211F" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="12" y="12" width="24" height="24" rx="6" fill="#8B5CF6" fill-opacity="0.15"/>
      <circle cx="24" cy="24" r="5" fill="#8B5CF6"/>
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#ECECEB">
        External Skill Manager
      </text>
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" fill="#9C9A92">
        Keahlian portabel SKILL.md aman
      </text>
    </g>

    <!-- 4. Integration Manager (Bottom-Right) -->
    <g transform="translate(246, 218)">
      <rect x="0" y="0" width="214" height="68" rx="10" fill="#21211F" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="12" y="12" width="24" height="24" rx="6" fill="#38BDF8" fill-opacity="0.15"/>
      <circle cx="24" cy="24" r="5" fill="#38BDF8"/>
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#ECECEB">
        Integration Manager
      </text>
      <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9.5" fill="#9C9A92">
        MCP &amp; integrasi native aplikasi
      </text>
    </g>

    <!-- Down Connector 2 (Arrow) -->
    <g transform="translate(240, 286)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#D97757" stroke-width="1.5" stroke-opacity="0.6"/>
      <polygon points="0,22 -4,15 4,15" fill="#D97757"/>
    </g>

    <!-- Bottom Card: Native OS Execution Layer -->
    <g transform="translate(20, 312)">
      <rect x="0" y="0" width="440" height="64" rx="12" fill="#1C1C1A" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.2"/>
      <rect x="14" y="14" width="36" height="36" rx="8" fill="#10B981" fill-opacity="0.12"/>
      <circle cx="32" cy="32" r="6" fill="#10B981"/>
      <text x="60" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#ECECEB">
        Native OS Execution Layer
      </text>
      <text x="60" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#9C9A92">
        Windows / macOS · Akses sesuai izin · Audit Ledger · Emergency Stop
      </text>
    </g>
  </g>
</svg>
