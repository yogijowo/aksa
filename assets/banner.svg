      <rect x="21" y="21" width="6" height="6" rx="1" fill="#D97757"/>
      <rect x="29" y="21" width="6" height="6" rx="1" fill="#D97757"/>
      <rect x="21" y="29" width="6" height="6" rx="1" fill="#D97757"/>
