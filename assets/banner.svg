<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250">
  <defs>
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#D97757" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Warm Obsidian Canvas (#141413) -->
  <rect x="1" y="1" width="1198" height="248" rx="18" fill="#141413"/>
  <rect x="1" y="1" width="1198" height="248" rx="18" fill="url(#ambientGlow)"/>
  <rect x="1" y="1" width="1198" height="248" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Centered Brand Lockup: Modern Claude-Inspired 'A' Logo + AKSA + Desktop -->
  <g transform="translate(0, 38)">
    <!-- Modern Faceted 'A' Logo Container (72x72) -->
    <g transform="translate(414, 0)">
      <rect x="0" y="0" width="72" height="72" rx="18" fill="#181715"/>
      <rect x="0" y="0" width="72" height="72" rx="18" fill="#D97757" fill-opacity="0.1" stroke="#D97757" stroke-opacity="0.45" stroke-width="1.5"/>
      <rect x="2" y="2" width="68" height="68" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

      <!-- Scaled 256x256 Precision Faceted Delta 'A' -->
      <g transform="translate(4, 4) scale(0.25)">
        <!-- Chevron Crossbar -->
        <polygon points="94,164 128,138 128,164 86,194" fill="#FFD0BF"/>
        <polygon points="128,138 162,164 170,194 128,164" fill="#F09373"/>
        <!-- Right Outer Leg -->
        <path d="M 128 36 C 135 36 141 40 144 47 L 208 191 C 211 198 206 205 198 205 L 179 205 C 173 205 168 201 166 195 L 128 80 Z" fill="#C65D3D"/>
        <!-- Left Outer Leg -->
        <path d="M 128 36 L 128 80 L 90 195 C 88 201 83 205 77 205 L 58 205 C 50 205 45 198 48 191 L 112 47 C 115 40 121 36 128 36 Z" fill="#E88464"/>
        <!-- Claude Spark Inside Vault -->
        <path d="M 128 103 C 129.3 111 131.8 113.5 140 115 C 131.8 116.5 129.3 119 128 127 C 126.7 119 124.2 116.5 116 115 C 124.2 113.5 126.7 111 128 103 Z" fill="#FFF5F0"/>
      </g>
    </g>

    <!-- Primary AKSA Wordmark -->
    <text x="506" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="60" font-weight="800" fill="#F5F5F3" letter-spacing="1.5">
      AKSA
    </text>

    <!-- Subtle 'Desktop' Pill Badge -->
    <rect x="698" y="23" width="78" height="28" rx="8" fill="#21211F" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
    <text x="737" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#9C9A92" letter-spacing="0.3">
      Desktop
    </text>
  </g>

  <!-- Subtle Accent Divider -->
  <line x1="470" y1="134" x2="730" y2="134" stroke="#D97757" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Full Indonesian Name & Tagline (Single Clean Text Node — No overlapping tspans) -->
  <text x="600" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#ECECEB" letter-spacing="0.3">
    Asisten Kerja &amp; Sistem Automasi
  </text>

  <text x="600" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="13.5" font-weight="400" fill="#9C9A92" letter-spacing="0.4">
    AI Desktop Operating Assistant · Multi-Agent Orchestrator · Local Hybrid RAG · Enterprise Security
  </text>
</svg>
