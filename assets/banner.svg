<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="25%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#21211F" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242422" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#191918" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="aksaPrimaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9676"/>
      <stop offset="60%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#B85536"/>
    </linearGradient>
    <linearGradient id="aksaSecondaryGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F28E6E"/>
      <stop offset="100%" stop-color="#9C3E20"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E2DF"/>
    </linearGradient>

    <!-- Core Nexus / Eye Gradient -->
    <radialGradient id="nexusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Deep Slate Canvas -->
  <rect width="1200" height="480" fill="#141413"/>
  <rect width="1200" height="480" fill="url(#bgGlow)"/>
  <rect width="1200" height="480" fill="url(#nodeGlow)"/>
  <rect width="1200" height="480" fill="url(#dotGrid)"/>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="478" rx="0" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- ================= LEFT: HERO BRANDING ================= -->
  <g transform="translate(80, 72)">
    <!-- Pill Badge -->
    <g filter="url(#dropShadow)">
      <rect x="0" y="0" width="365" height="32" rx="16" fill="#21211F" stroke="#D97757" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="16" cy="16" r="4.5" fill="#10B981"/>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#ECECEB" letter-spacing="0.8">
        LOCAL-FIRST DESKTOP AUTOMATION AGENT
      </text>
    </g>

    <!-- Logo & Giant Typography -->
    <g transform="translate(0, 52)">
      <!-- Logo Emblem Box -->
      <g filter="url(#dropShadow)">
        <rect x="0" y="0" width="68" height="68" rx="18" fill="#1E1E1C" stroke="#D97757" stroke-opacity="0.35" stroke-width="1.5"/>
        
        <!-- Embedded AKSA Geometric Monogram (Scaled from 256x256) -->
        <g transform="translate(4.5, 4.5) scale(0.23)" filter="url(#logoShadow)">
          <!-- Left Wing of 'A' -->
          <path d="M 128 44 L 128 82 L 78 184 L 46 184 Z" fill="url(#aksaPrimaryGrad)"/>
          <!-- Right Wing of 'A' -->
          <path d="M 128 44 L 210 184 L 178 184 L 128 82 Z" fill="url(#aksaSecondaryGrad)"/>
          <!-- Central Crossbar -->
          <path d="M 82 144 L 174 144 L 160 166 L 96 166 Z" fill="#D97757" fill-opacity="0.95"/>
          <!-- Radiant Nexus / Eye -->
          <g transform="translate(128, 126)" filter="url(#softGlow)">
            <circle cx="0" cy="0" r="18" fill="#10B981" fill-opacity="0.25"/>
            <polygon points="0,-12 12,0 0,12 -12,0" fill="url(#nexusGlow)"/>
            <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
          </g>
        </g>
      </g>

      <!-- Typography -->
      <text x="86" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="68" font-weight="900" fill="url(#textGrad)" letter-spacing="5">
        AKSA
      </text>
    </g>

    <!-- Acronym & Full Meaning -->
    <g transform="translate(0, 164)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="700" fill="#ECECEB" letter-spacing="0.3">
        <tspan fill="#D97757">A</tspan>sisten <tspan fill="#D97757">K</tspan>erja &amp; <tspan fill="#D97757">S</tspan>istem <tspan fill="#D97757">A</tspan>utomasi
      </text>
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="400" fill="#9C9A92">
        Kontrol &amp; Automasi Aplikasi Perangkat, Berkas &amp; Alur Kerja Komputer
      </text>
    </g>

    <!-- Feature Tag Pills -->
    <g transform="translate(0, 232)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="148" height="28" rx="8" fill="#1F1F1D" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
      <circle cx="14" cy="14" r="3.5" fill="#D97757"/>
      <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#DCDCDA">
        Tim Agen Bertingkat
      </text>

      <!-- Tag 2 (Broadened: Automasi Aplikasi & File PC) -->
      <rect x="158" y="0" width="176" height="28" rx="8" fill="#1F1F1D" stroke="#10B981" stroke-opacity="0.25" stroke-width="1"/>
      <circle cx="172" cy="14" r="3.5" fill="#10B981"/>
      <text x="184" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#DCDCDA">
        Automasi Aplikasi &amp; File PC
      </text>

      <!-- Tag 3 -->
      <rect x="344" y="0" width="138" height="28" rx="8" fill="#1F1F1D" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
      <circle cx="358" cy="14" r="3.5" fill="#8B5CF6"/>
      <text x="370" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#DCDCDA">
        Hybrid RAG Lokal
      </text>

      <!-- Tag 4 (Row 2) -->
      <rect x="0" y="38" width="148" height="28" rx="8" fill="#1F1F1D" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
      <circle cx="14" cy="52" r="3.5" fill="#F59E0B"/>
      <text x="26" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#DCDCDA">
        Hemat Token 80%
      </text>

      <!-- Tag 5 (Row 2) -->
      <rect x="158" y="38" width="176" height="28" rx="8" fill="#1F1F1D" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
      <circle cx="172" cy="52" r="3.5" fill="#38BDF8"/>
      <text x="184" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#DCDCDA">
        Remote Telegram HP
      </text>
    </g>
  </g>

  <!-- ================= RIGHT: INTERACTIVE MOCKUP GRAPHIC ================= -->
  <g transform="translate(670, 50)" filter="url(#dropShadow)">
    <!-- Mockup Desktop Window -->
    <rect x="0" y="0" width="460" height="380" rx="14" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect x="0" y="0" width="460" height="42" rx="14" fill="#1C1C1A" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    <!-- Mac Window Dots -->
    <circle cx="22" cy="21" r="5" fill="#EF4444" fill-opacity="0.75"/>
    <circle cx="38" cy="21" r="5" fill="#F59E0B" fill-opacity="0.75"/>
    <circle cx="54" cy="21" r="5" fill="#10B981" fill-opacity="0.75"/>
    <text x="230" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#71716E">
      aksa-desktop — Kontrol &amp; Automasi Aplikasi Perangkat
    </text>

    <!-- Node Connection Lines -->
    <path d="M 230 115 C 230 155, 95 155, 95 195" fill="none" stroke="#D97757" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 3"/>
    <path d="M 230 115 C 230 155, 230 155, 230 195" fill="none" stroke="#10B981" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M 230 115 C 230 155, 365 155, 365 195" fill="none" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- Supervisor Node (Top Center) -->
    <g transform="translate(130, 65)">
      <rect x="0" y="0" width="200" height="60" rx="10" fill="#292825" stroke="#D97757" stroke-width="1.5"/>
      <circle cx="24" cy="30" r="12" fill="#D97757" fill-opacity="0.2"/>
      <circle cx="24" cy="30" r="5" fill="#D97757"/>
      <text x="46" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="700" fill="#ECECEB">
        Manajer Eksekutif
      </text>
      <text x="46" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="500" fill="#9C9A92">
        Claude 3.7 / Gemini 2.5
      </text>
      <rect x="148" y="10" width="42" height="16" rx="4" fill="#D97757" fill-opacity="0.2"/>
      <text x="169" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#D97757">
        TIER 0
      </text>
    </g>

    <!-- Sub-Agent 1: App & Document Automation (Left) -->
    <g transform="translate(20, 195)">
      <rect x="0" y="0" width="130" height="64" rx="9" fill="#1F1F1D" stroke="#10B981" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="18" cy="22" r="4" fill="#10B981"/>
      <text x="28" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="700" fill="#ECECEB">
        Automasi File &amp; App
      </text>
      <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" fill="#9C9A92">
        Office, Browser, File
      </text>
      <text x="14" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#10B981">
        • DeepSeek / Local
      </text>
    </g>

    <!-- Sub-Agent 2: RAG Researcher (Center) -->
    <g transform="translate(165, 195)">
      <rect x="0" y="0" width="130" height="64" rx="9" fill="#1F1F1D" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="18" cy="22" r="4" fill="#8B5CF6"/>
      <text x="28" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="700" fill="#ECECEB">
        Peneliti RAG
      </text>
      <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" fill="#9C9A92">
        LanceDB + FTS5
      </text>
      <text x="14" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#8B5CF6">
        • Ollama Qwen 2.5
      </text>
    </g>

    <!-- Sub-Agent 3: PC System & App Operator (Right) -->
    <g transform="translate(310, 195)">
      <rect x="0" y="0" width="130" height="64" rx="9" fill="#1F1F1D" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="18" cy="22" r="4" fill="#F59E0B"/>
      <text x="28" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" font-weight="700" fill="#ECECEB">
        Operator Sistem
      </text>
      <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" fill="#9C9A92">
        App Control, UV, Win32
      </text>
      <text x="14" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#F59E0B">
        • HITL Approval Gate
      </text>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(20, 280)">
      <rect x="0" y="0" width="420" height="76" rx="9" fill="#1A1A18" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
      <!-- Status Icon -->
      <circle cx="24" cy="24" r="6" fill="#10B981" fill-opacity="0.2"/>
      <circle cx="24" cy="24" r="3" fill="#10B981"/>
      <text x="38" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#ECECEB">
        Workspace Sandbox: <tspan fill="#D97757">Akses Aplikasi &amp; Folder PC (Aktif)</tspan>
      </text>
      
      <!-- Metrics Row -->
      <text x="24" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#9C9A92">
        Efisiensi Token: <tspan fill="#10B981" font-weight="700">79.2% Hemat</tspan>
      </text>
      <text x="180" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#9C9A92">
        Local RAG: <tspan fill="#ECECEB" font-weight="600">LanceDB Siap</tspan>
      </text>
      <text x="320" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" fill="#38BDF8" font-weight="600">
        Telegram Online
      </text>
    </g>
  </g>
</svg>