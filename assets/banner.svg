<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <!-- Ambient Warm Obsidian Glows (Claude Desktop Palette) -->
    <radialGradient id="bgGlowTerracotta" cx="22%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#D97757" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#21211F" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowEmerald" cx="82%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.11"/>
      <stop offset="55%" stop-color="#D97757" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
    </radialGradient>

    <!-- Surface Gradients -->
    <linearGradient id="windowCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21211F" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#191918" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="aksaPrimaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9676"/>
      <stop offset="60%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#B85536"/>
    </linearGradient>
    <linearGradient id="aksaSecondaryGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F28E6E"/>
      <stop offset="100%" stop-color="#9C3E20"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E5E2"/>
    </linearGradient>
    <radialGradient id="nexusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>

    <!-- Shadows & Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Editorial Grid -->
    <pattern id="editorialGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.035"/>
    </pattern>
  </defs>

  <!-- Base Canvas (#141413 Warm Charcoal) -->
  <rect width="1200" height="520" fill="#141413"/>
  <rect width="1200" height="520" fill="url(#bgGlowTerracotta)"/>
  <rect width="1200" height="520" fill="url(#bgGlowEmerald)"/>
  <rect width="1200" height="520" fill="url(#editorialGrid)"/>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="1198" height="518" rx="0" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

