      <circle cx="16" cy="105" r="4" fill="#D97757"/>
      <text x="28" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#ECECEB">
