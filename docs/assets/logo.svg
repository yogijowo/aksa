<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="logoBgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#282826"/>
      <stop offset="100%" stop-color="#141413"/>
    </radialGradient>

    <!-- Accent Terracotta Gradients -->
    <linearGradient id="aksaPrimaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9676"/>
      <stop offset="60%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#B85536"/>
    </linearGradient>

    <linearGradient id="aksaSecondaryGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F28E6E"/>
      <stop offset="100%" stop-color="#9C3E20"/>
    </linearGradient>

    <!-- Core Nexus / Eye Gradient (Aksa = Mata / Poros) -->
    <radialGradient id="nexusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#logoBgGlow)" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#D97757" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Geometric AKSA Monogram Mark (Stylized 'A' + Nexus Eye) -->
  <g filter="url(#logoShadow)">
    <!-- Left Wing of 'A' -->
    <path d="M 128 44 L 128 82 L 78 184 L 46 184 Z" fill="url(#aksaPrimaryGrad)"/>

    <!-- Right Wing of 'A' -->
    <path d="M 128 44 L 210 184 L 178 184 L 128 82 Z" fill="url(#aksaSecondaryGrad)"/>

    <!-- Dynamic Central Crossbar -->
    <path d="M 82 144 L 174 144 L 160 166 L 96 166 Z" fill="#D97757" fill-opacity="0.9"/>

    <!-- Central Intelligent Nexus / Core (Aksa = Mata yang Jernih & Poros Automasi) -->
    <g transform="translate(128, 126)" filter="url(#coreGlow)">
      <!-- Outer Pulse Ring -->
      <circle cx="0" cy="0" r="16" fill="#10B981" fill-opacity="0.18"/>
      <!-- Inner Diamond / Nexus Eye -->
      <polygon points="0,-10 10,0 0,10 -10,0" fill="url(#nexusGlow)"/>
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
