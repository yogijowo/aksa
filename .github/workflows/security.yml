name: Security — Dependency Audit, Secret Scan & SAST

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  security-regression-and-audit:
    name: Security Regression & Supply Chain Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: "20"

      - name: Install Python engine & security test suite
        working-directory: services/engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Full P0/P1/P2 Adversarial Security Regression Suite
        working-directory: services/engine
        run: |
          python -m pytest tests/test_p0_*.py tests/test_p1_*.py tests/test_p2_*.py tests/test_phase6_*.py tests/test_phase7_*.py tests/test_phase8_*.py tests/test_audit_*.py tests/test_reaudit_*.py -v

      - name: Audit Production Frontend Dependencies (Strict Blocking)
        working-directory: apps/desktop
        run: |
          npm audit --omit=dev --audit-level=high

      - name: Audit Development Dependencies (Non-blocking Warning)
        working-directory: apps/desktop
        continue-on-error: true
        run: |
          npm audit --audit-level=high
