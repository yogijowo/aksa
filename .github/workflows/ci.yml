name: CI — Multi-Platform Verification Matrix

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-and-frontend:
    name: Verify Engine & Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux sandbox & Tauri build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: "20"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Install Python backend dependencies
        working-directory: services/engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python unit, integration, and security regression tests
        working-directory: services/engine
        shell: bash
        run: |
          mkdir -p ../../build
          set -o pipefail
          python -m pytest tests -v -rs --timeout=90 --timeout-method=thread -o faulthandler_timeout=75 --durations=25 --junitxml=../../build/junit-pytest-${{ matrix.os }}.xml 2>&1 | tee ../../build/pytest-${{ matrix.os }}.log

      - name: Enforce native Windows AppContainer runtime tests (fail on skip)
        if: matrix.os == 'windows-latest'
        working-directory: services/engine
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("../../build/junit-pytest-${{ matrix.os }}.xml").getroot()
          required = {
              "test_real_windows_appcontainer_blocks_network_and_outside_writes",
              "test_p1_01_real_windows_child_cannot_inherit_unrelated_parent_handle",
              "test_p2_01_verifier_real_sandbox_blocks_write_network_and_outside_access",
              "test_p1_01_skill_replay_xlsx_end_to_end_works_inside_os_sandbox",
          }
          statuses = {}
          for tc in root.iter("testcase"):
              name = tc.attrib.get("name", "")
              if name in required:
                  statuses[name] = "skipped" if tc.find("skipped") is not None else ("failed" if tc.find("failure") is not None or tc.find("error") is not None else "passed")
          print("Windows native sandbox test statuses:", statuses)
          assert set(statuses) == required and all(v == "passed" for v in statuses.values()), f"Missing or skipped Windows tests: {statuses}"
          PY

      - name: Enforce native Linux bubblewrap runtime tests (fail on skip)
        if: matrix.os == 'ubuntu-latest'
        working-directory: services/engine
        shell: bash
        run: |
          bwrap --version
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("../../build/junit-pytest-${{ matrix.os }}.xml").getroot()
          required = {
              "test_real_linux_bwrap_isolates_home_and_network",
              "test_p2_04_real_linux_bwrap_blocks_network_proc_symlinks_and_traversal",
              "test_p2_01_verifier_real_sandbox_blocks_write_network_and_outside_access",
              "test_p1_01_skill_replay_xlsx_end_to_end_works_inside_os_sandbox",
          }
          statuses = {}
          for tc in root.iter("testcase"):
              name = tc.attrib.get("name", "")
              if name in required:
                  statuses[name] = "skipped" if tc.find("skipped") is not None else ("failed" if tc.find("failure") is not None or tc.find("error") is not None else "passed")
          print("Linux bwrap native sandbox test statuses:", statuses)
          assert set(statuses) == required and all(v == "passed" for v in statuses.values()), f"Missing or skipped Linux tests: {statuses}"
          PY

      - name: Run Python module sidecar smoke test
        run: |
          python scripts/release_tooling.py smoke-test

      - name: Build native PyInstaller sidecar binary for target triple
        run: |
          python scripts/build_sidecar.py

      - name: Verify target-triple sidecar executable exists and is non-stub
        run: |
          python scripts/build_sidecar.py --verify-only

      - name: Smoke-test compiled native sidecar binary
        run: |
          python scripts/release_tooling.py smoke-test --require-executable

      - name: Install Desktop Frontend dependencies
        working-directory: apps/desktop
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Run Desktop Frontend Vitest test suite
        working-directory: apps/desktop
        run: |
          npm run test -- --reporter=verbose

      - name: TypeScript typecheck & Vite production build
        working-directory: apps/desktop
        run: |
          npm run build

      - name: Run Rust native tests
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Verify Rust Tauri build validity
        run: |
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Generate CycloneDX SBOM artifact in CI
        run: |
          python scripts/release_tooling.py sbom --output build/aksa-ci-sbom.json

      - name: Publish CI Verification Summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET, os, sys
          sys.path.insert(0, "scripts")
          from build_sidecar import detect_target_triple, resolve_sidecar_binary_path

          matrix_os = "${{ matrix.os }}"
          xml_path = f"build/junit-pytest-{matrix_os}.xml"
          log_path = f"build/pytest-{matrix_os}.log"
          summary_lines = [f"### AKSA Cross-Platform CI Summary ({matrix_os})\n"]

          def _annot(level: str, msg: str) -> None:
              clean = msg.replace("%", "%25").replace("\r", "").replace("\n", " | ")
              print(f"::{level}::{clean[:1200]}")

          if os.path.exists(xml_path):
              root = ET.parse(xml_path).getroot()
              ts = root if root.tag == "testsuite" else root.find("testsuite")
              if ts is not None:
                  stat_msg = f"tests={ts.attrib.get('tests')}, skipped={ts.attrib.get('skipped')}, failures={ts.attrib.get('failures')}, errors={ts.attrib.get('errors')}, time={ts.attrib.get('time')}s"
                  summary_lines.append(f"- **Pytest (`services/engine`):** {stat_msg}")
                  cases = []
                  for tc in ts.findall("testcase"):
                      t = float(tc.attrib.get("time", "0") or 0)
                      name = f"{tc.attrib.get('classname', '')}::{tc.attrib.get('name', '')}"
                      cases.append((t, name, tc))
                  cases.sort(key=lambda x: x[0], reverse=True)
                  slow_top = ", ".join(f"{n} ({t:.2f}s)" for t, n, _ in cases[:8])
                  _annot("notice", f"Pytest ({matrix_os}): {stat_msg} | Slowest: {slow_top}")
                  summary_lines.append(f"- **Slowest tests:** {slow_top}")
                  for t, name, tc in cases:
                      bad = tc.find("failure")
                      if bad is None:
                          bad = tc.find("error")
                      if bad is not None:
                          detail = (bad.attrib.get("message") or bad.text or "")[-600:]
                          _annot("error", f"FAIL {name} ({t:.2f}s): {detail}")
              else:
                  summary_lines.append("- **Pytest JUnit XML parsed without testsuite element**")
          else:
              summary_lines.append("- **Pytest JUnit XML not produced**")
              if os.path.exists(log_path):
                  with open(log_path, encoding="utf-8", errors="replace") as fh:
                      all_lines = fh.read().splitlines()
                  highlights = [
                      ln for ln in all_lines
                      if any(tok in ln for tok in ("tests/test_", "Timeout", "FAILED", "ERROR", "Event loop", "Current thread", "File \""))
                  ]
                  tail = all_lines[-20:]
                  _annot("error", f"Pytest JUnit missing ({matrix_os}). Last tests/timeout: " + " | ".join(highlights[-12:]))
                  _annot("error", f"Pytest log tail ({matrix_os}): " + " | ".join(tail))

          triple = detect_target_triple()
          bin_path = resolve_sidecar_binary_path(triple)
          if bin_path.exists():
              summary_lines.append(f"- **Sidecar Binary (`{triple}`):** `{bin_path.name}` ({bin_path.stat().st_size:,} bytes)")
          else:
              summary_lines.append(f"- **Sidecar Binary (`{triple}`):** missing at `{bin_path}`")
          summary_lines.append("- **Checks executed in this job:** pytest + real PyInstaller sidecar build & verification + compiled sidecar smoke-test + npm audit + vitest + tsc/vite build + cargo test + cargo check + CycloneDX SBOM")

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as sf:
                  sf.write("\n".join(summary_lines) + "\n")
          PY
