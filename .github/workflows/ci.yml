name: CI — Multi-Platform Verification Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-and-frontend:
    name: Verify Engine & Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python backend dependencies
        working-directory: services/engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python unit, integration, and security regression tests
        working-directory: services/engine
        run: |
          python -m pytest tests -v

      - name: Install Desktop Frontend dependencies
        working-directory: apps/desktop
        run: |
          npm ci

      - name: TypeScript typecheck & Vite production build
        working-directory: apps/desktop
        run: |
          npm run build
