name: CI — Multi-Platform Verification Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-and-frontend:
    name: Verify Engine & Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux sandbox & Tauri build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: "20"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7b7640ea77234a04593cb566060c41097e8e50b7 # stable

      - name: Install Python backend dependencies
        working-directory: services/engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python unit, integration, and security regression tests
        working-directory: services/engine
        run: |
          python -m pytest tests -v

      - name: Run sidecar engine lifecycle smoke test
        run: |
          python scripts/release_tooling.py smoke-test

      - name: Verify sidecar build configuration
        run: |
          python scripts/build_sidecar.py --dry-run

      - name: Install Desktop Frontend dependencies
        working-directory: apps/desktop
        run: |
          npm ci
          npm audit --omit=dev

      - name: Run Desktop Frontend Vitest test suite
        working-directory: apps/desktop
        run: |
          npm run test

      - name: TypeScript typecheck & Vite production build
        working-directory: apps/desktop
        run: |
          npm run build

      - name: Run Rust native tests
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Verify Rust Tauri build validity
        run: |
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Generate CycloneDX SBOM artifact in CI
        run: |
          python scripts/release_tooling.py sbom --output build/aksa-ci-sbom.json
