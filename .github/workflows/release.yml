name: Release — Multi-Platform Tauri Build, Checksums & Provenance

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-gate-verification:
    name: Pre-Release Security & Quality Gate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & verify Python test suite (33 tests)
        working-directory: services/engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest tests -v

      - name: Verify Frontend TypeScript & Vite bundle
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
