name: Release — Multi-Platform Tauri Build, SBOM, Checksums & Provenance

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            ext: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: "20"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7b7640ea77234a04593cb566060c41097e8e50b7 # stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install Python dependencies & PyInstaller
        working-directory: services/engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python automated tests
        working-directory: services/engine
        run: |
          python -m pytest tests -v

      - name: Build frozen native sidecar binary
        run: |
          python scripts/build_sidecar.py --triple ${{ matrix.triple }}

      - name: Smoke test frozen native sidecar binary
        run: |
          python scripts/release_tooling.py smoke-test --executable apps/desktop/src-tauri/binaries/aksa-engine-${{ matrix.triple }}${{ matrix.ext }}

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: |
          npm ci

      - name: Build frontend bundle
        working-directory: apps/desktop
        run: |
          npm run build

      - name: Build Tauri native application bundle
        working-directory: apps/desktop
        run: |
          npx tauri build

      - name: Prepare Release Dist Directory
        shell: bash
        run: |
          mkdir -p dist/release
          # Copy compiled sidecar binary
          cp apps/desktop/src-tauri/binaries/aksa-engine-${{ matrix.triple }}${{ matrix.ext }} dist/release/
          # Copy Tauri bundles if generated
          find apps/desktop/src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist/release/ \; || true

      - name: Generate CycloneDX SBOM for release
        run: |
          python scripts/release_tooling.py sbom --output dist/release/aksa-sbom-${{ matrix.triple }}.cyclonedx.json

      - name: Generate SHA-256 Checksums (SHA256SUMS.txt)
        shell: bash
        run: |
          cd dist/release
          python ../../scripts/release_tooling.py checksums --artifacts * --output SHA256SUMS.txt
          python ../../scripts/release_tooling.py verify-checksums --file SHA256SUMS.txt

      - name: Attest Build Provenance (SLSA Level 3)
        uses: actions/attest-build-provenance@c074443f1a5fb4a493905b08452b42e67c276566 # v1.4.2
        with:
          subject-path: "dist/release/*"

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/release/*
          generate_release_notes: true
