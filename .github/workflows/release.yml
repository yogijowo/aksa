name: Release — Multi-Platform Tauri Build, Checksums & Provenance

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install Python dependencies & PyInstaller
        working-directory: services/engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python automated tests
        working-directory: services/engine
        run: |
          python -m pytest tests -v

      - name: Build frozen native sidecar binary
        run: |
          python scripts/build_sidecar.py --triple ${{ matrix.triple }}

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: |
          npm ci

      - name: Build frontend bundle
        working-directory: apps/desktop
        run: |
          npm run build

      - name: Build Tauri native application bundle
        working-directory: apps/desktop
        run: |
          npx tauri build
